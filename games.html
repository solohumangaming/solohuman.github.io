<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Hub — Solo Human</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="games-only-page">
<header class="nav">
  <a class="brand" href="#home"><img src="sh-logo.png" alt="SH"><span>SOLO <i>HUMAN</i><small>GAMING • TECH • ANIME • MORE</small></span></a>
  <nav>
    <a class="active" href="#home">Home</a><a href="#games">Games</a><a href="#software">Software</a>
    <a href="#wallpapers">Wallpapers</a><a href="#anime">Anime</a><a href="#youtube">YouTube</a><a href="#support">Help</a><a href="#more">More</a>
  </nav>
  <div class="actions"><input id="globalSearch" placeholder="Search anything..."><button id="themeBtn">☼</button></div>
</header>
<section class="games-page" id="games">
  <div class="games-hero">
    <div class="games-hero-inner">
      <div class="games-kicker"><span>✚</span> SOLO HUMAN</div>
      <h1>Games Hub</h1>
      <p>Discover the best free & paid games — handpicked, reviewed, and ready to download.</p>
      <div class="games-stats">
        <span>🎁 <b id="freeCount">6</b> Free Games</span>
        <span>🪙 <b id="paidCount">6</b> Paid Games</span>
        <span>☆ All Genres Covered</span>
      </div>
    </div>
  </div>

  <div class="games-toolbar">
    <div class="type-filters" role="tablist" aria-label="Game type">
      <button class="game-filter active" data-type="all">🎮 All</button>
      <button class="game-filter" data-type="free">🎁 Free</button>
      <button class="game-filter" data-type="paid">💎 Paid</button>
    </div>

    <div class="genre-filters" role="tablist" aria-label="Game genre">
      <button class="genre-filter active" data-genre="all">All</button>
      <button class="genre-filter" data-genre="Action">Action</button>
      <button class="genre-filter" data-genre="RPG">RPG</button>
      <button class="genre-filter" data-genre="Strategy">Strategy</button>
      <button class="genre-filter" data-genre="FPS">FPS</button>
      <button class="genre-filter" data-genre="Indie">Indie</button>
      <button class="genre-filter" data-genre="Horror">Horror</button>
    </div>
  </div>

  <div class="games-result"><span>Showing</span> <b id="gameResultCount">12</b> games</div>
  <div class="games-grid" id="gamesGrid"></div>
</section>
<script src="games.js"></script>
</body>
</html>
